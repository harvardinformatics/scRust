# Reference datasets for validation (docs/PLAN.md A1, A4 and A5b): for every file, where it
# lives, its sha256 and size, how it was made, and what it is for. Fixtures are recipes: on
# another cluster, regenerate them with the recorded script in the pinned env and compare
# checksums before running any Rust test.
#
# Entries so far: the R vectors for rcompat (M1). Exports and direct reference runs arrive with M2.
# No code reads this file yet. Layout, one table per file:
#
# [[file]]
# path = "tests/fixtures/doubletfinder/soupx_tenx_test/..."   # or data/... (large, gitignored)
# sha256 = "..."
# bytes = 0
# tool = "doubletfinder"
# dataset = "soupx_tenx_test"
# tier = "T"                   # T (workflow test data), P (production samples) or full-panel
# role = "input"               # input, reference (direct R run) or saved-output (workflow's)
# stage = "S2a"                # for references: the stage it checks (tolerances.toml)
# profile = "portable"         # portable (OPENBLAS_CORETYPE=Haswell) or production (auto-detected)
# source = "..."               # the workflow artifact it was exported from, if any
# recipe = "validation/R/export_doubletfinder.R"
# env = "envs/r-reference"
# fingerprint = "..."          # CPU model, OpenBLAS core name, threads, glibc of the run

