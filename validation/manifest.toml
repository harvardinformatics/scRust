# DoubletFinder (plan B4) ---------------------------------------------------------------------
#
# Datasets
# - Tier T: the five workflow test objects DoubletFinder reads,
#   tests/reference_outputs/testdata/results/<arm>/seurat_<arm>_test.rds in the pipeline repo:
#   soupx_tenx_test, decontx_raw_tenx_test, soupx_emptydrops_test, decontx_raw_emptydrops_test,
#   cellbender_fromraw_test. Inputs: counts and seurat_clusters.
# - Tier P: soupx_tenx_SRR18256555 (small), soupx_tenx_10xmousebrain (medium),
#   soupx_emptydrops_4500871lane (medium 2), soupx_emptydrops_sscovelli (large),
#   cellbender_fromraw_ghirsutum2 (memory outlier); saved outputs in
#   results/doubletfinder/seurat_doubletfinder_<object>.rds.
# - Full panel: all 150 production DoubletFinder runs; inputs and saved-output fields only.
#
# Reference files, by stage (direct and instrumented R runs, per dataset and profile)

# S0 RNG and R semantics: R-generated vectors (Mersenne-Twister streams, sampling, rnorm,
#    round, seq, order, sum and mean, number formatting) and .Random.seed checkpoints: the
#    rcompat files above (M1); fft arrives with the kde crate

# S1 sampling: the sweep subsample (n > 10,000), doublet index pairs for each pN and for the
#    final run, and the RNG state after each step

# S2a SCTransform setup: log_umi, filtered genes, geometric means, fitting cells and genes,
#     500-gene bins, RNG state

# S2b SCTransform fits: per-gene Beta and theta

# S2c SCTransform regularisation: regularised parameters

# S2d SCTransform residuals: residual variance, the 3,000 variable features (ordered),
#     scale.data (small and medium objects only)

# S3 PCA: standard deviations, embeddings, RNG state afterwards

# S4 neighbours: the first `ind` order positions for each real cell

# S5 pANN: per cell, for every (pN, pK) of the sweep and for the final run

# S6 sweep: BCreal for each (pN, pK), bcmvn, the chosen pK

# S7 calls: nExp, the Doublet/Singlet classification, the column names R writes
