# K7 (M10), teacher-forced: scrust cluster --snn on each R run's own SNN graph, against that run
# (scrust validate cluster; docs/validation/clustering_m10.md) and the instrumented optimizer on the
# same graph. No BLAS is involved, so these are exact on any machine, in either profile, at any
# thread count. Per resolution: the optimizer's ids before GroupSingletons, the final ids, the
# labels and levels, every line FindClusters printed but the elapsed time (nodes, edges, the maximum
# modularity as %.4f, communities), GroupSingletons' singletons in order and its message, every
# random start's iterations and modularity (bitwise) and partition, the best start, R's
# .Random.seed after GroupSingletons where it drew (and an unchanged state where it did not); then
# seurat_clusters, its levels, cluster_ids.txt and nclusters.txt; for tier P the workflow job's
# logged numbers. Settled (M10): exact in every comparison, with no exception:
#   the workflow's settings: all 98 instrumented runs of the 27 tier-T and 7 tier-P objects (M8's,
#     both profiles, Sapphire Rapids and Cascade Lake, the v5 runs), the 4 tier-P objects with
#     singletons included (1, 18, 22 and 40);
#   other settings (validation/R/cluster_references.R on the saved graphs): 465 settings of the 34
#     objects (algorithms 2 and 3, modularity function 2, five resolutions in one call,
#     group.singletons = FALSE, starts 1 and 20, iterations 1 and 50, seeds 0 and 1), where R stops
#     in 4 (every cell a singleton) and Rust stops with R's message;
#   53 settings of 20 constructed edge cases (C7): cargo test recomputes 717 of R's files and compares
#     their sha256 (crates/cluster/tests/edge_cases.rs); in 3 of them R stops, and so does Rust.
[clustering.K7]
criterion = "exact"
compare = ["optimizer ids", "final ids", "labels", "levels", "printed numbers", "singletons", "every start's iterations and modularity", "every start's partition", "best start", ".Random.seed after GroupSingletons", "seurat_clusters", "cluster_ids.txt", "nclusters.txt", "workflow log (tier P)"]
detail = "modularities bitwise; labels and levels as text; files byte for byte"

# Threads (M10, scrust cluster): resolutions run in parallel, the starts of one resolution in
# turn. Five resolutions at 1 and 32 threads on both 79,409-cell objects (job 60510816,
# validation/slurm/m10_benchmark.sbatch), and at 1 and 8 threads on all 34 objects' `resolutions`
# reference (m10_cluster.sbatch): every file byte-identical, and summary.json's result section;
# cargo test compares 1, 2, 3, 4 and 7 threads on tier T.
[clustering.threads_cluster]
criterion = "byte-identical"

# Performance (M10): FindClusters alone on the two 79,409-cell objects' saved graphs, one node (Xeon
# Platinum 8480CL, test partition, job 60510816). R: the workflow's call, FindClusters(obj,
# random.seed = 12345) (cluster_references.R --mode bench); findclusters_s is the call,
# process_wall_s and peak_rss_gib the whole Rscript (loading Seurat and the graph included). Rust:
# scrust cluster --snn (binary scrust-m10-e0a40a9, whose clustering is the final binary's),
# clustering_s = building the network and every resolution, process_wall_s and peak_rss_gib the
# whole command (reading the graph and writing the outputs included). For comparison, R's
# FindClusters step in M8's direct production runs of the chain took 31.2-36.0 s on other nodes.
# Measurements; the chain's criterion (C5) is settled at M11.
[clustering.performance_cluster]
measured_m10 = [
  { object = "soupx_emptydrops_sscovelli", side = "R", resolutions = 1, threads = 1, findclusters_s = 19.8, process_wall_s = 36.5, peak_rss_gib = 1.10 },
  { object = "soupx_emptydrops_sscovelli", side = "Rust", resolutions = 1, threads = 1, clustering_s = 14.2, process_wall_s = 15.2, peak_rss_gib = 0.15 },
  { object = "soupx_emptydrops_sscovelli", side = "Rust", resolutions = 5, threads = 1, clustering_s = 66.5, process_wall_s = 67.5, peak_rss_gib = 0.15 },
  { object = "soupx_emptydrops_sscovelli", side = "Rust", resolutions = 5, threads = 32, clustering_s = 15.0, process_wall_s = 16.1, peak_rss_gib = 0.42 },
  { object = "filtered_seurat_emptydrops_sscovelli", side = "R", resolutions = 1, threads = 1, findclusters_s = 20.8, process_wall_s = 35.8, peak_rss_gib = 1.13 },
  { object = "filtered_seurat_emptydrops_sscovelli", side = "Rust", resolutions = 1, threads = 1, clustering_s = 14.8, process_wall_s = 15.8, peak_rss_gib = 0.15 },
  { object = "filtered_seurat_emptydrops_sscovelli", side = "Rust", resolutions = 5, threads = 1, clustering_s = 70.3, process_wall_s = 71.3, peak_rss_gib = 0.15 },
  { object = "filtered_seurat_emptydrops_sscovelli", side = "Rust", resolutions = 5, threads = 32, clustering_s = 15.4, process_wall_s = 16.4, peak_rss_gib = 0.41 },
]

# Threads (M11), the chain: scrust cluster --counts --preset workflow at one thread and at many,
# every file compared byte for byte, and summary.json's result section. Tier T, both profiles:
# 8 and 1 threads on all 27 objects (m11_cluster.sbatch's second run; 62 files each: the outputs,
# sct/, every start's partition, the stage dumps). Tier P, portable: 8 and 1 threads on all 7
# (labels m11-eedf376 and m11-eedf376-t1, job 60805276, validation/slurm/m11_threads.sh; 55-56
# files, the stage dumps included), and the 1-thread runs' 17 validation reports identical to the
# 8-thread runs' check by check. Tier P, production: 1 and 32 threads (the benchmark, job
# 60804011) and 8 (the validation run): the 17 output files. cargo test compares 1, 2 and 5
# threads on tier T, and the staged starts with the one-process run. Settled (M11): byte-identical
# in every comparison.
[clustering.threads]
criterion = "byte-identical"
compared = [
  { tier = "T", profile = "portable", objects = 27, threads = [8, 1], files = 62, differing = 0 },
  { tier = "T", profile = "production", objects = 27, threads = [8, 1], files = 62, differing = 0 },
  { tier = "P", profile = "portable", objects = 7, threads = [8, 1], files = "55-56", differing = 0 },
  { tier = "P", profile = "production", objects = 7, threads = [1, 32, 8], files = 17, differing = 0 },
]

# Performance (M11), the chain: scrust cluster --counts --preset workflow on the seven tier-P
# objects, without stage dumps, at 1 and 32 threads, one Sapphire Rapids node (Xeon Platinum 8480CL,
# test partition, 32 CPUs reserved; job 60804011, validation/slurm/m11_benchmark.sbatch, binary
# scrust-m11-eedf376), against M8's direct production R runs of the chain on the same inputs (R with
# OpenBLAS at one thread, the same CPU type), without RunUMAP and, for context, with it. wall_s and
# peak_rss_gib: the whole process (/usr/bin/time -v); R's to_silhouette_s: from the timer's start,
# after loading the packages, to the end of the silhouette (reading the input included), R's
# like-for-like with Rust's run, which computes no purity yet (M12) and writes no export (M13);
# purity_s and write_s: R's shares that Rust does not have yet. Rust's stage times include writing
# each stage's files (run.phases; the validation binary's chain times carried an offset of at most
# 0.12 s, counted in SCTransform, fixed after the runs). Settled (M11): met. Rust at one thread takes
# 2.7-5.7 times less time than R's whole run and 2.0-2.6 times less than R's chain alone, at 32
# threads 8.6-17.4 times less than R's whole run, and peaks at 0.15-3.19 GiB against R's
# 2.50-104.13 GiB; 3.15 GiB (1 thread) and 3.19 GiB (32) on the 79,409-cell objects.
