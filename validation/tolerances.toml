# Threads (M11), the chain: scrust cluster --counts --preset workflow at one thread and at many,
# every file compared byte for byte, and summary.json's result section. Tier T, both profiles:
# 8 and 1 threads on all 27 objects (m11_cluster.sbatch's second run; 62 files each: the outputs,
# sct/, every start's partition, the stage dumps). Tier P, portable: 8 and 1 threads on all 7
# (labels m11-eedf376 and m11-eedf376-t1, job 60805276, validation/slurm/m11_threads.sh; 55-56
# files, the stage dumps included), and the 1-thread runs' 17 validation reports identical to the
# 8-thread runs' check by check. Tier P, production: 1 and 32 threads (the benchmark, job
# 60804011) and 8 (the validation run): the 17 output files. cargo test compares 1, 2 and 5
# threads on tier T, and the staged starts with the one-process run. Settled (M11): byte-identical
# in every comparison.
[clustering.threads]
criterion = "byte-identical"
compared = [
  { tier = "T", profile = "portable", objects = 27, threads = [8, 1], files = 62, differing = 0 },
  { tier = "T", profile = "production", objects = 27, threads = [8, 1], files = 62, differing = 0 },
  { tier = "P", profile = "portable", objects = 7, threads = [8, 1], files = "55-56", differing = 0 },
  { tier = "P", profile = "production", objects = 7, threads = [1, 32, 8], files = 17, differing = 0 },
]
# M12 (label m12-4231635; m12_cluster.sbatch, the one-thread tier-P run job 61652418, the benchmark
# job 61652420), with purity: the same comparisons, every file byte-identical, the K9 dumps and the
# certificate's arrays included; the one-thread tier-P runs' 17 reports equal the 8-thread runs'
# check by check. cargo test compares 1, 2, 5 and 16 threads.
compared_m12 = [
  { tier = "T", profile = "portable", objects = 27, threads = [8, 1], files = "71 or 76", differing = 0 },
  { tier = "T", profile = "production", objects = 27, threads = [8, 1], files = "71 or 76", differing = 0 },
  { tier = "P", profile = "portable", objects = 7, threads = [8, 1], files = "63-68", differing = 0 },
  { tier = "P", profile = "production", objects = 7, threads = [1, 32, 8], files = 17, differing = 0 },
]
# M13 (label m13-9ce0adb; m13_cluster.sbatch's second run on tier T, the one-thread tier-P run job
# 61798842 and m13_threads.sh, the benchmark job 61798843), with --export: every file byte-identical,
# the export (counts/, sct/ with both layers, metadata.tsv, README.txt) and the K10 dumps included,
# and summary.json's result section and manifest entries; the one-thread tier-P runs' 17 reports
# equal the 8-thread runs' check by check. cargo test compares 1 and 3 threads, with and without
# the stage dumps.
compared_m13 = [
  { tier = "T", profile = "portable", objects = 27, threads = [8, 1], files = "80 or 85", differing = 0 },
  { tier = "T", profile = "production", objects = 27, threads = [8, 1], files = "80 or 85", differing = 0 },
  { tier = "P", profile = "portable", objects = 7, threads = [8, 1], files = "78-83", differing = 0 },
  { tier = "P", profile = "production", objects = 7, threads = [1, 32, 8], files = 31, differing = 0 },
]

