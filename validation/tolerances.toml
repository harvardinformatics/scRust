# K10, the corrected counts (M13; docs/PLAN.md C3f, C5): sctransform 0.4.3's correct(), which vst()
# calls on its own residuals before clipping them (return_corrected_umi = TRUE, Seurat's
# do.correct.umi): the residuals floored at min_variance and not clipped; the regressors
# [1, median(log_umi)] (R's median); per bin of 500 genes, mu = exp(tcrossprod(model_pars_fit[, -1],
# regressors)) through R's dgemm call and shapes; the variance mu + mu^2 / theta, not floored; the
# value mu + residual * sqrt(variance); round(x, 0) (nearbyint: half to even), negatives to 0,
# zeros dropped (make.sparse); the SCT data layer log1p of it (glibc's); nCount_SCT and
# nFeature_SCT its column sums and nonzero counts (crates/sctransform/src/correct.rs). Made in
# S2d's pass, one bin's products at a time (the product at the median depth in the free product
# buffer, kept as its runs of equal values), never as a dense genes x cells matrix.
# Compared, with scrust cluster --export (scrust validate cluster): from the stage dumps,
# K10_genes, correct()'s scalars (the median log_umi, the residuals beyond the clip range, the
# number of entries, its settings) and .Random.seed at its entry; the files against every R run
# of the profile on their data lines (R's comment lines name R's script): sct/corrected_counts.mtx.gz
# always, sct/log1p_corrected_counts.mtx.gz where R kept it (level full: tier T), else R's digest of
# the log1p data's values (raw_sha256(data@x), standard and light levels: tier P); R's digest of the
# counts' values; sct_features.tsv.gz and sct_cells.tsv.gz; the counts' summary (features, entries,
# minimum, explicit zeros); metadata.tsv's nCount_SCT and nFeature_SCT; the same against the saved
# object (under its kernel, SapphireRapids). Teacher-forced: correct() on R's model_pars_fit, cell
# attributes (stages/vst/), K10_genes and the counts, against R's layers, digests, columns and
# scalars. mu is a BLAS product, so every K10 check but K10_genes, the settings and the median is
# BLAS-dependent, teacher-forced too (graded under the validator's own kernel against R's): exact
# under the reference's kernel; otherwise against [clustering.floor.kernel], whose K10 entries are
