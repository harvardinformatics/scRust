# Kernel-gated grading (M11; docs/PLAN.md A5b mechanism 3): `scrust validate cluster` grades every
# check exactly when the reference's and the candidate's recorded OpenBLAS kernels match;
# otherwise, or when either run records none, BLAS-free checks stay exact and BLAS-dependent ones
# are graded against [clustering.floor.kernel] (bounds as described there; what it does not list
# stays exact). The checks against the saved object are graded under the saved object's kernel
# (SapphireRapids, the kernel of every workflow job, M8). The report gives the mode, why, and each
# check's class and criterion. A check is BLAS-dependent when any of its inputs passed through a
# BLAS product in the candidate's run (crates/cluster/src/validate.rs, Grader::class):
#   - from the counts (--counts): BLAS-free are the settings, the barcodes, the counts' columns
#     (nCount_RNA, nFeature_RNA), S2a, the RNG states of SCTransform and RunPCA's entry (fixed
#     draw counts) and the teacher-forced silhouette; BLAS-dependent is everything from S2b on
#     (glmGamPoi's Cox-Reid term and nlminb call BLAS): S2b-S2d, S3, irlba's exit state, K3-K8,
#     the labels, the graphs, the files and the result section;
#   - from SCTransform's output (--sct): RunPCA (S3) and everything after it;
#   - from R's own embeddings or SNN graph (--pca, --snn): nothing (teacher forcing, as M9's and
#     M10's runs).
[clustering.kernel_gating]
exact_when = "the reference's and the candidate's recorded OpenBLAS kernels match"
otherwise = "tolerance: BLAS-free checks exact; BLAS-dependent checks within [clustering.floor.kernel], exact where it lists nothing"
no_kernel_recorded = "tolerance (never exact)"
saved_object_kernel = "SapphireRapids"
blas_free = ["FindClusters' settings", "barcodes", "nCount_RNA", "nFeature_RNA", "S2a", "SCTransform's RNG states", "RunPCA's entry and irlba's entry states", "approxSilhouette teacher-forced on R's embeddings and labels", "neighborPurity teacher-forced on R's embeddings and labels (M12)", "the purity certificate (a property of the search)", "every check of a run started from R's embeddings or SNN graph"]
blas_dependent = ["S2b", "S2c", "S2d", "scale.data's digest", "S3", "irlba's exit state", "K3", "K4", "K5", "K6", "K7", "K8", "K9 (M12)", "the result section's numbers", "the saved object's labels, silhouette widths and purities"]
floor = "clustering.floor.kernel"

# K0, Kiss64Random (M9): RcppAnnoy 0.0.23's kissrandom.h, compiled with the R env's compiler and
# flags (tests/fixtures/clustering/k0/, M8), against crates/neighbors (tests/k0_kiss64.rs):
# kiss(), index(n) for 21 values of n from 1 to 2^32 + 1, flip(), and one stream of 1,449 mixed
# calls, from the default seed and three others. JavaRandom and GroupSingletons' draw: M10.
# Settled (M9): exact.
[clustering.K0_kiss64]
criterion = "exact"
compare = ["kiss", "index", "flip", "mixed"]

# K3-K6 (M9), teacher-forced: scrust neighbors on each R run's own embeddings (columns 1:30, or a
# constructed input), against that run (scrust validate neighbors; docs/validation/clustering_m9.md).
# No BLAS is involved, so these are exact on any machine, in either profile, at any thread count.
# Settled (M9): exact in every comparison, with no exception:
#   euclidean: all 98 instrumented runs of the 27 tier-T and 7 tier-P objects (M8's, both
#     profiles, Sapphire Rapids and Cascade Lake, the v5 runs);
#   cosine (AnnoyAngular) and manhattan: validation/R/neighbors_references.R on 57 instrumented
#     runs' embeddings (the 27 tier-T objects in both profiles, soupx_tenx_SRR18256555 in both,
#     soupx_emptydrops_sscovelli portable): 114 comparisons;
#   25 constructed edge cases (C7) x 3 metrics: cargo test compares 732 files by sha256
#     (crates/neighbors/tests/edge_cases.rs), the command line 72 cases; the 3 one-cell cases are
