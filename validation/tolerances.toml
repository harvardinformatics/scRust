# Match criteria for each tool, stage and output (docs/PLAN.md A4 and B5). Three kinds:
#   exact      bitwise or integer equality
#   numeric    relative and/or absolute tolerance
#   agreement  fraction identical, correlation
# Exact checks run only when the BLAS-relevant fields of the environment fingerprint match the
# reference's; otherwise the harness switches to tolerance mode (the R-vs-R floor, measured at
# M2) and says so in its report (A5b).
#
# The criteria are the plan's (B5) and the key names a proposal. Each stage is uncommented and
# settled when its milestone lands (S0: M1; S1 and S4-S7: M3; S2a-S2d: M4; S3: M5; the end-to-end,
# saved-output and performance rows: M6). `scrust validate doubletfinder`
# (crates/doubletfinder/src/validate.rs) applies the settled criteria: everything it compares
# must be identical.

# DoubletFinder -------------------------------------------------------------------------------

# S0 RNG and R semantics: vectors and checkpoints against R (M1). Settled: every double bitwise,
# NaN payloads included (crates/rcompat/tests/r_vectors.rs, tests/fixtures/rcompat/).
[doubletfinder.S0]
criterion = "exact"

# R-vs-R floor (M2; docs/validation/doubletfinder_m2.md): how far R itself moves when only the
# machine changes. Measured with instrumented runs (every stage array and .Random.seed
# checkpoint, block by block) on the five tier-T objects and on soupx_tenx_SRR18256555,
# soupx_tenx_10xmousebrain and soupx_emptydrops_4500871lane; the two large objects end to end.
# Settled as measurements; the stage criteria below are settled at their milestones.
#
# Same kernel, different CPU types: OPENBLAS_CORETYPE=Haswell (the portable profile) on Sapphire
# Rapids (Xeon Platinum 8480CL) and Cascade Lake (Xeon Platinum 8268), tier T and
# soupx_tenx_SRR18256555: every stage array, RNG checkpoint and final file bit-identical.
[doubletfinder.floor.cpu_type]
all_stages = "identical"

# Different kernels, same CPU type: Haswell against SapphireRapids (the production profile, by
# detection) on Sapphire Rapids. Maxima over objects and contexts; max_scaled is
# max|a - b| / max|a| within one block; S3 embeddings and loadings after aligning each
# component's sign (irlba's signs can flip between kernels). Everything not listed is identical:
# S1, S2a, S2b, S2c, all RNG checkpoints (so irlba's draw count), S4, S5, S6, S7 and the final
# cells.tsv, sweep_stats.tsv and bcmvn.tsv.
[doubletfinder.floor.kernel]
S2d_residual_stats = { max_abs = 5.7e-14, max_scaled = 1.4e-16 }
S2d_scale_data = { max_abs = 2.2e-14, max_scaled = 1.2e-15, max_fraction_differing = 0.008 }
S3_sdev = { max_rel = 7.3e-15 }
S3_embeddings = { max_abs = 3.6e-11, max_scaled = 2.5e-13 }
S3_loadings = { max_abs = 8.1e-14, max_scaled = 3.0e-13 }

# S1 sampling: subsample and doublet index pairs, RNG state after each step. Settled (M3):
# exact. From R's own .Random.seed before each draw, rcompat redraws the sweep subsample
# (sample(1:n, 10000), when n > 10,000) and both sample(real.cells, n_doublets, replace = TRUE)
# draws of every sweep iteration and of the final run: identical to R's S1_subsample and
# S1_doublets, and R's .Random.seed afterwards identical, in all 24 instrumented runs of the 10
# objects (docs/validation/doubletfinder_m3.md). The Rust runs of M3 take the draws from R
# (teacher forcing); M6 makes them.
[doubletfinder.S1]
criterion = "exact"
compare = ["S1_subsample", "S1_doublets", "rng_state_after"]

# S2a SCTransform setup: log_umi, filtered genes, gmeans, fitting cells and genes, bins,
# RNG state (M4a). Settled (M4): exact. In every context of all 24 instrumented runs of the 10
# objects, from the SCT input rebuilt from the counts and R's S1 draws: cell attributes, the gene
# filter, geometric means, means and variances (explicit zeros as R stores them), the fitting
# cells and genes, the density-weighted gene sampling (density, probabilities, the draw), and R's
# .Random.seed at vst's entry, after the cell sampling and at the fits' entry
# (docs/validation/doubletfinder_m4.md).
[doubletfinder.S2a]
criterion = "exact"
compare = ["S2a_cells", "S2a_genes", "S2a_gene_stats", "S2a_cells_step1", "S2a_genes_step1_pool",
           "S2a_genes_step1", "S2a_log_gmean_step1", "S2a_sampling_prob", "S2a_density",
           "rng_vst_entry", "rng_after_cell_sampling", "rng_fits_entry"]

# S2b SCTransform fits: per-gene Beta and theta, given R's fitting cells and genes (M4b).
# Settled (M4): exact, so the decision point's fallback (relative 1e-6) is not needed. Every
# intermediate of every gene's glmGamPoi fit (moment dispersion and start, first Newton fit and
# its iterations, the overdispersion MLE through nlminb with the Cox-Reid term, the trend, the
# second fit, its iterations and deviance), model_pars before and after the 1e-7 floor, and the
# RNG state at each bin's future_lapply and at the fits' exit, in all 24 runs; the Cox-Reid
# sums are OpenBLAS dgemv calls, identical across kernels at these sizes.
[doubletfinder.S2b]
criterion = "exact"
compare = ["S2b_glm", "S2b_model_pars_raw", "S2b_model_pars", "rng_bin_entry", "rng_fits_exit"]

# S2c SCTransform regularisation: regularised parameters, given R's fit outputs (M4c). Settled
# (M4): exact. model_pars_fit of every kept gene, the outliers, the Poisson and smoothing genes,
# mean(colSums(umi)) and the bw.SJ bandwidth, in all 24 runs.
[doubletfinder.S2c]
criterion = "exact"
compare = ["S2c_model_pars_fit", "S2c_outliers", "S2c_poisson_genes", "S2c_smoothing_genes",
           "mean_cell_sum", "reg_bw"]

# S2d SCTransform residuals: residual variance, the 3,000 variable features (ordered) and
# scale.data, given R's parameters (M4d). Settled (M4): exact when the OpenBLAS kernel is the
# reference run's (the residuals' tcrossprod is a dgemm call): residual mean and variance of every
# kept gene, the top, variable and PCA features in order, min_variance and both clip ranges, and
# wherever R dumped them the full residual matrix and scale.data, in all 24 runs, each under its
# own profile (portable runs with OPENBLAS_CORETYPE=Haswell, production runs with SapphireRapids
# detected). Under another kernel the comparison is not exact; the fallback stays as proposed.
# Floor (M2): across OpenBLAS kernels, residual statistics and scale.data differ in the last
# bits on the larger objects (at most 5.7e-14 absolute, in at most 0.8% of a scale.data block);
# bit-identical on tier T, and across CPU types with the same kernel. Fallback, about 20 times
# the floor: numeric, abs = 1e-12.
[doubletfinder.S2d]
criterion = "exact"
blas_dependent = true
compare = ["S2d_residual_stats", "S2d_top_features", "S2d_variable_features", "S2d_pca_features",
           "S2d_scale_data", "S2d_y", "min_variance", "res_clip_range", "clip_range"]
otherwise = { criterion = "numeric", abs = 1e-12 }

# S2 chained (M4): the whole SCTransform from the counts and R's S1 draws, each sub-stage on the
# previous one's Rust results; every S2 array, scalar and RNG checkpoint above plus the states at
# vst's and SCTransform's exits. Settled: exact, in all 24 runs (under each run's kernel).
[doubletfinder.S2_chain]
criterion = "exact"
blas_dependent = true

# S3 PCA: standard deviations, embeddings (up to sign per component), RNG state afterwards (M5).
# Identical when the BLAS kernel matches the fixture; otherwise relative <= 1e-10. The RNG state
# must always match exactly.
# Floor (M2): across kernels, sdev relative 7.3e-15, embeddings max|diff|/max|value| 2.5e-13
# (components can flip sign); RNG states identical. The plan's 1e-10 leaves a margin of ~400.
# Settled (M5): exact, signs included, under the run's own OpenBLAS kernel (Haswell for the
# portable runs, SapphireRapids for the production runs, detected). In all 7 contexts of all 24
# instrumented runs of the 10 objects, teacher-forced on R's PCA input (for the light runs, on
# Rust's S2d, itself identical to R's) and chained after Rust's own SCTransform: irlba's d, the
# standard deviations, the embeddings, the loadings, the PCA features (PrepDR's filter),
# irlba's iterations and products, total.variance, and R's .Random.seed at RunPCA's entry, at
# irlba's entry and exit and at RunPCA's exit (docs/validation/doubletfinder_m5.md). The results
# do not depend on the number of threads. Under another kernel the comparison is not exact; the
# fallback stays as proposed.
[doubletfinder.S3]
criterion = "exact"
blas_dependent = true
compare = ["S3_irlba_d", "S3_sdev", "S3_embeddings", "S3_loadings", "S2d_pca_features",
           "irlba_iter", "irlba_mprod", "total_variance", "pca_n_features",
           "rng_pca_entry", "rng_irlba_entry", "rng_irlba_exit", "rng_pca_exit"]
otherwise = { criterion = "numeric", rel = 1e-10 }
rng_state = "exact"

# S3 chained (M5): RunPCA on Rust's own SCTransform of the counts and R's S1 draws, with the
# generator SCTransform left; every S3 array, scalar and RNG checkpoint above. Settled: exact, in
# all 24 runs (under each run's kernel).
[doubletfinder.S3_chain]
criterion = "exact"
blas_dependent = true

# S4 neighbours: the first `ind` (sweep) or k + 1 (final) order positions of every real cell.
# Plan floor: identical for >= 99.99% of cells, each difference explained by a near-tie.
# Floor (M2): identical across kernels and CPU types on every object (the S3 differences above
# move no neighbour), so S5-S7 are identical too.
# Settled (M3): exact. On R's own S3 embeddings, every cell's S4 digest is identical in all 24
# instrumented runs of the 10 objects, and on tier T the full order positions (15 runs,
# 3.1 million positions), including the lower-index twins of cellbender_fromraw_ghirsutum2 that
# come before the cell itself. No near-tie needed explaining.
[doubletfinder.S4]
criterion = "exact"
compare = ["S4_digest", "S4_positions"]

# S5 pANN, sweep and final, per cell. Plan floor: identical for >= 99.9% of cells; otherwise
# |difference| <= 2/k.
# Settled (M3): exact, bit for bit, for every pK of every sweep iteration and the final run, in
# all 24 instrumented runs (and cells.tsv byte-identical to every direct R run's).
[doubletfinder.S5]
criterion = "exact"
compare = ["S5_pann_sweep", "S5_pann_final"]

# S6 sweep: BCreal and the chosen pK. Plan floor: BCreal relative <= 1e-6; pK identical.
# Settled (M3): exact. bkde's grid and density, the values passed to bimodality_coefficient and
# BCreal are bit-identical for every (pN, pK) (teacher-forced on R's S5 and chained from Rust's
# S5); sweep_stats.tsv and bcmvn.tsv byte-identical; pK, its label and the column names
# identical, in all 24 instrumented runs.
[doubletfinder.S6]
criterion = "exact"
compare = ["S6_bkde", "S6_gkde", "BCreal", "bcmvn", "pK", "pK_label"]

# S7 calls: nExp and the Doublet/Singlet set. Plan floor: nExp identical; >= 99.9% agreement,
# every difference at the pANN cutoff.
# Settled (M3): exact. nExp_poi, the homotypic proportion and nExp identical; the calls
# identical (also teacher-forced on R's final pANN), in all 24 instrumented runs, including the
# ties at the cutoff (stable descending order).
[doubletfinder.S7]
criterion = "exact"
compare = ["nExp_poi", "homotypic_prop", "nExp", "S7_doublet"]

# End to end (M6): `scrust doubletfinder` from the counts, the cluster labels and the seed, every
# stage computed by Rust, the random-number state flowing through the seven contexts of a run
# from Rust's own draws (nothing read from an R run). Settled: exact, under the reference run's
# OpenBLAS kernel (the portable runs with OPENBLAS_CORETYPE=Haswell, the production runs with
# SapphireRapids detected; the kernel each run recorded is compared too). In all 24 instrumented
# runs of the 10 objects: every block of every stage array R dumped, S1 to S7 (scale.data and the
# residual matrix wherever R dumped them), every .Random.seed checkpoint and their sequence, every
# per-context scalar, the final files and every field of summary.json's result section, the
# digest of R's final .Random.seed included. In all 23 direct runs: cells.tsv, sweep_stats.tsv
# and bcmvn.tsv byte-identical, the result section identical. Not compared: summary.json's run
# section, a record of the run (R's and Rust's differ by nature: script or program, input and
# output paths, start time, SLURM job, profile label, versions and library paths, timings and
# memory per phase; R's load_input_s and peak_rss_after_load_kib, Rust's parameters, threads
# and dump level), apart from the OpenBLAS kernel in its fingerprint; and R's five structural
# checks of its own Seurat containers among the stage scalars (vst_rows_are_input_features,
# scale_data_rows_are_top_features, variable_features_equal_top_features,
# scale_data_equals_sctransform_default_y, pca_cells_are_vst_cells), which hold by
# construction in Rust (docs/validation/doubletfinder.md). The results do not depend on the
# number of threads (1, 8 and 32 on the P objects; 1 to 7 on tier T). Validation label m6-bc1b48e
# (job 60007108): 24 instrumented runs, 13,396 checks and 2,646 RNG checkpoints identical, 1.58
# billion values compared; 23 direct runs and 20 saved-output comparisons identical.
[doubletfinder.end_to_end]
criterion = "exact"
blas_dependent = true
compare = ["cells.tsv", "sweep_stats.tsv", "bcmvn.tsv", "result", "S1", "S2a", "S2b", "S2c", "S2d", "S3",
           "S4", "S5", "S6", "S7", "rng_checkpoints", "rng_checkpoint_sequence", "stage_scalars",
           "openblas_kernel"]
not_compared = ["summary.json run section (except the OpenBLAS kernel)", "R's structural checks of its own containers"]

# Against the saved workflow outputs (tiers T and P; the full panel in M7): the doublet set
# (input barcodes minus the kept barcodes), the kept cells' pANN as R wrote them, pK and nExp
# (from the column names). Settled (M6): exact. Rust's run of each of the 10 objects reproduces
# its saved output in both profiles: the same doublet set, every kept cell's pANN identical as
# 17-digit text (so bitwise), in order, the same pK label, nExp and column names.
[doubletfinder.saved_outputs]
criterion = "exact"
compare = ["doublet_set", "singlet_pANN", "pK_label", "nExp", "pANN_column", "classification_column"]

# Performance: peak RSS and wall time below the direct R DoubletFinder run on the same input;
# soupx_emptydrops_sscovelli <= 10 GiB. Settled (M6): met. `scrust doubletfinder` on the exported
# input, production profile, Intel Xeon Platinum 8480CL, against the direct production R run of
# M2 on the same input and CPU type (one CPU), every output identical to R's
# (docs/validation/doubletfinder.md; jobs 60007089 and 60007102, binary scrust-m6-bc1b48e):
#   soupx_emptydrops_sscovelli     R 36:15, 126.95 GiB; Rust 6:21, 4.41 GiB (1 thread), 43.5 s, 4.51 GiB (32)
#   cellbender_fromraw_ghirsutum2  R 33:53, 150.41 GiB; Rust 8:58, 4.02 GiB (1 thread), 60.9 s, 4.08 GiB (32)
[doubletfinder.performance]
criterion = "peak RSS and wall time below the direct R run on the same input and CPU type"
sscovelli_peak_rss_gib_max = 10
measured = [
  { object = "soupx_emptydrops_sscovelli", side = "R", threads = 1, wall_s = 2175.3, peak_rss_gib = 126.95 },
  { object = "soupx_emptydrops_sscovelli", side = "Rust", threads = 1, wall_s = 380.6, peak_rss_gib = 4.41 },
  { object = "soupx_emptydrops_sscovelli", side = "Rust", threads = 32, wall_s = 43.5, peak_rss_gib = 4.51 },
  { object = "cellbender_fromraw_ghirsutum2", side = "R", threads = 1, wall_s = 2033.0, peak_rss_gib = 150.41 },
  { object = "cellbender_fromraw_ghirsutum2", side = "Rust", threads = 1, wall_s = 538.4, peak_rss_gib = 4.02 },
  { object = "cellbender_fromraw_ghirsutum2", side = "Rust", threads = 32, wall_s = 60.9, peak_rss_gib = 4.08 },
]
