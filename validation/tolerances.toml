  { object = "soupx_emptydrops_sscovelli", side = "Rust", threads = 32, build_s = 3.70, search_s = 0.41, graphs_s = 0.09, neighbors_s = 4.2, process_wall_s = 6.8, peak_rss_gib = 0.44 },
  { object = "filtered_seurat_emptydrops_sscovelli", side = "R", threads = 1, findneighbors_s = 27.8, process_wall_s = 33.7, peak_rss_gib = 1.60 },
  { object = "filtered_seurat_emptydrops_sscovelli", side = "Rust", threads = 1, build_s = 3.72, search_s = 15.67, graphs_s = 0.98, neighbors_s = 20.4, process_wall_s = 24.8, peak_rss_gib = 0.26 },
