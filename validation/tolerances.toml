# M11's measurement with the grader's statistics, job 60798602: K10_genes and correct()'s scalars,
# the median log_umi and the residuals beyond the clip range among them, 0 of 34 objects
# differing). The residuals correct() reads differ in their last bits on tier P (S2d), but no
# corrected value crosses a rounding boundary. The bounds are zero, so in tolerance mode these
# checks stay exact.
K10_corrected_counts = { values_differing = 0, cells_differing = 0, objects = 34, note = "every entry of the SCT counts layer, and its digest" }
K10_log1p_data = { values_differing = 0, cells_differing = 0, objects = 34, note = "the SCT data layer, in full on tier T, as R's digest on tier P" }
K10_nCount_SCT = { values_differing = 0, cells_differing = 0, objects = 34 }
K10_nFeature_SCT = { values_differing = 0, cells_differing = 0, objects = 34 }
K10_genes = { values_differing = 0, objects = 34 }
