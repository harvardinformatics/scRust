vst_umi_corrected_nnz = { values_differing = 0, objects = 34 }

# R-vs-R floor with SCTransform's vars.to.regress (M15b; docs/PLAN.md A5b, C3j, C5's K14; decided
# 2026-11-19). The regression's QR (R's LINPACK dqrdc2 and dqrsl, through OpenBLAS's dnrm2,
# dscal, ddot and daxpy) makes every regressed row of scale.data kernel-dependent, and the PCA and
# the scores after it move with it, beyond [clustering.floor.kernel]. So a floor of its own,
# used only when both runs record the same non-empty vars.to.regress (crates/cluster/src/validate.rs
# floor_for: R's result.regression.vars, scrust's run.parameters.sctransform.vars_to_regress); it
# stands alone: an array it does not list is exact. [clustering.floor.kernel] and every unregressed
# grading are unchanged.
# Measured as [clustering.floor.kernel] was (M8; M11 with the grader's statistics): R's direct runs
# of every case in the production profile (OPENBLAS_CORETYPE unset: SapphireRapids, Xeon 8480CL)
# and the portable one (Haswell; tier T on Xeon 8268 nodes, the others on 8480CL: under one kernel
# the CPU type changes nothing, M8's [clustering.floor.cpu_type]), validation/slurm/
# m15b_references.sbatch; compared by validation/python/m15b_floor.py, which ports
# scio::grade::stats line for line (and reproduces the validator's figures), on the arrays the
# validator grades for these runs, in both directions (either run as the reference); each bound
# the maximum over the cases, rounded up to two significant digits; cells_differing the total over
# the cases, so it bounds one case too. The cases: validation/m15b_cases.tsv, all 134 (27 tier-T
# objects x 4 cases; the 4 mouse tier-P objects x 4, the other 3 tier-P objects 4 cases; the
# zebrafish and the bearded dragon x 3): percent.mt by the workflow's pattern and by a list of
# ids, with nCount_RNA, and a --metadata column. data/clustering/m15b/floor/: r_vs_r.tsv (every
# case, array and direction), summary.md (the maxima by tier, the case that sets each). set_by
# names that case (the reference's profile in brackets); t, p and x give the maximum on tier T, P
# and the two other objects.
# Identical across kernels in every case, and so not listed (exact): the labels and levels
# (seurat_clusters, SCT_snn_res.0.8), both graphs, the variable features, the corrected counts,
# percent.mt (102 cases write it) and the counts' columns, the regression's rank and pivot.
[clustering.floor.kernel_regressed]
S2d_scale_data = { max_abs = 5.6e-13, max_fraction_differing = 0.72, cases_differing = 130, set_by = "max_abs: soupx_emptydrops_4500871lane ids_ncount (production); fraction: posthocfilt_threshold_scdblfinder_decontx_raw_tenx_test ids_ncount", t = "9.6e-15, 0.7145", p = "5.578e-13, 0.6572", x = "4.547e-13, 0.6953", note = "the 130 cases whose runs kept scale.data (the four light-level ones keep its digest)" }
S3_embeddings_dims_1_30 = { max_abs = 6.2e-10, max_scaled = 2.6e-12, cases_differing = 134, set_by = "max_abs: soupx_emptydrops_sscovelli pm (production); max_scaled: decontx_raw_tenx_test ids (portable)", t = "3.793e-11, 2.542e-12", p = "6.181e-10, 2.323e-12", x = "2.229e-10, 8.556e-13" }
S3_embeddings_dims_31_50 = { max_abs = 5.5e-6, cases_differing = 134, set_by = "posthocfilt_threshold_scdblfinder_cellbender_fromraw_test pm (production)", t = "5.462e-6", p = "5.128e-10", x = "1.038e-10", note = "trailing components of the smallest tier-T objects, as in [clustering.floor.kernel]" }
S3_loadings = { max_abs = 1.7e-7, max_scaled = 6.0e-7, cases_differing = 134, set_by = "posthocfilt_threshold_scdblfinder_cellbender_fromraw_test pm (production; portable for max_scaled)", t = "1.666e-7, 5.947e-7", p = "2.331e-12, 4.424e-12", x = "1.14e-12, 2.692e-12" }
S3_sdev = { max_abs = 2.7e-13, max_scaled = 5.0e-14, cases_differing = 134, set_by = "posthocfilt_threshold_scdblfinder_cellbender_fromraw_test pm (production; portable for max_scaled)", t = "2.618e-13, 4.959e-14", p = "1.013e-13, 5.493e-15", x = "3.464e-14, 1.52e-15" }
total_variance = { max_abs = 1.2e-13, max_scaled = 2.2e-16, cases_differing = 1, set_by = "doubletfinder_soupx_tenx_test meta (production; portable for max_scaled)", t = "1.137e-13, 2.116e-16", p = "0", x = "0", note = "identical across kernels without the regression" }
K8_silhouette_width = { max_abs = 2.0e-12, cases_differing = 130, set_by = "soupx_emptydrops_sscovelli pm (production)", t = "6.409e-14", p = "1.945e-12", x = "6.581e-14" }
K9_purity = { cells_differing = 34, max_abs = 0.026, cases_differing = 18, set_by = "max_abs: doubletfinder_cellbender_fromraw_test ids (production); cells: 18 cases, at most 2 cells in one", t = "30 cells, 0.0258", p = "4 cells, 0.005554", x = "0" }

# Kernel-gated grading (M11; docs/PLAN.md A5b mechanism 3): `scrust validate cluster` grades every
# check exactly when the reference's and the candidate's recorded OpenBLAS kernels match;
# otherwise, or when either run records none, BLAS-free checks stay exact and BLAS-dependent ones
# are graded against [clustering.floor.kernel] (bounds as described there; what it does not list
# stays exact). The checks against the saved object are graded under the saved object's kernel
# (SapphireRapids, the kernel of every workflow job, M8). The report gives the mode, why, and each
# check's class and criterion. A check is BLAS-dependent when any of its inputs passed through a
# BLAS product in the candidate's run (crates/cluster/src/validate.rs, Grader::class):
#   - from the counts (--counts): BLAS-free are the settings, the barcodes, the counts' columns
#     (nCount_RNA, nFeature_RNA), S2a, the RNG states of SCTransform and RunPCA's entry (fixed
#     draw counts) and the teacher-forced silhouette; BLAS-dependent is everything from S2b on
#     (glmGamPoi's Cox-Reid term and nlminb call BLAS): S2b-S2d, S3, irlba's exit state, K3-K8,
#     the labels, the graphs, the files and the result section;
#   - from SCTransform's output (--sct): RunPCA (S3) and everything after it;
#   - from R's own embeddings or SNN graph (--pca, --snn): nothing (teacher forcing, as M9's and
#     M10's runs).
[clustering.kernel_gating]
exact_when = "the reference's and the candidate's recorded OpenBLAS kernels match"
otherwise = "tolerance: BLAS-free checks exact; BLAS-dependent checks within [clustering.floor.kernel], exact where it lists nothing"
no_kernel_recorded = "tolerance (never exact)"
saved_object_kernel = "SapphireRapids"
blas_free = ["FindClusters' settings", "barcodes", "nCount_RNA", "nFeature_RNA", "S2a", "SCTransform's RNG states", "RunPCA's entry and irlba's entry states", "approxSilhouette teacher-forced on R's embeddings and labels", "neighborPurity teacher-forced on R's embeddings and labels (M12)", "the purity certificate (a property of the search)", "every check of a run started from R's embeddings or SNN graph", "K10_genes, correct()'s settings, its median log_umi and RNG state at its entry, sct_features and sct_cells (M13)", "the output manifest (M13)"]
blas_dependent = ["S2b", "S2c", "S2d", "scale.data's digest", "S3", "irlba's exit state", "K3", "K4", "K5", "K6", "K7", "K8", "K9 (M12)", "K10: the corrected counts, their log1p, nCount_SCT, nFeature_SCT, the residuals beyond the clip range (M13)", "K10 teacher-forced (correct()'s mu is a dgemm; graded under the validator's own kernel against R's)", "the result section's numbers", "the saved object's labels, silhouette widths, purities, nCount_SCT, nFeature_SCT and SCT layers"]
floor = "clustering.floor.kernel"
# M15b: when both runs record the same non-empty vars.to.regress (R's result.regression.vars,
# scrust's run.parameters.sctransform.vars_to_regress), [clustering.floor.kernel_regressed]
# instead, on its own (an array it does not list is exact); every other comparison, the saved
# object's included, keeps [clustering.floor.kernel]. percent.mt and the regression's covariates
# are BLAS-free; its rank and pivot, and scale.data value by value, BLAS-dependent.
floor_regressed = "clustering.floor.kernel_regressed"
blas_free_m15b = ["percent.mt", "a regressed --metadata column", "the regression's covariates and columns", "percent.mt's features"]
blas_dependent_m15b = ["the regression's rank and pivot", "scale.data value by value"]

# K0, Kiss64Random (M9): RcppAnnoy 0.0.23's kissrandom.h, compiled with the R env's compiler and
# flags (tests/fixtures/clustering/k0/, M8), against crates/neighbors (tests/k0_kiss64.rs):
# kiss(), index(n) for 21 values of n from 1 to 2^32 + 1, flip(), and one stream of 1,449 mixed
# calls, from the default seed and three others. JavaRandom and GroupSingletons' draw: M10.
# Settled (M9): exact.
[clustering.K0_kiss64]
criterion = "exact"
compare = ["kiss", "index", "flip", "mixed"]

# K3-K6 (M9), teacher-forced: scrust neighbors on each R run's own embeddings (columns 1:30, or a
# constructed input), against that run (scrust validate neighbors; docs/validation/clustering_m9.md).
# No BLAS is involved, so these are exact on any machine, in either profile, at any thread count.
# Settled (M9): exact in every comparison, with no exception:
#   euclidean: all 98 instrumented runs of the 27 tier-T and 7 tier-P objects (M8's, both
#     profiles, Sapphire Rapids and Cascade Lake, the v5 runs);
#   cosine (AnnoyAngular) and manhattan: validation/R/neighbors_references.R on 57 instrumented
#     runs' embeddings (the 27 tier-T objects in both profiles, soupx_tenx_SRR18256555 in both,
#     soupx_emptydrops_sscovelli portable): 114 comparisons;
#   25 constructed edge cases (C7) x 3 metrics: cargo test compares 732 files by sha256
#     (crates/neighbors/tests/edge_cases.rs), the command line 72 cases; the 3 one-cell cases are
#     refused, as R's FindNeighbors fails on them.
[clustering.K3]
criterion = "exact"
compare = ["items: getItemsVector, or R's index file, against the first n nodes of annoy.ann"]

[clustering.K4]
criterion = "byte-identical"
compare = ["annoy.ann"]

[clustering.K5]
criterion = "exact"
compare = ["nn_index", "nn_dist"]
note = "scrust validate neighbors reads the distances as text, where every NaN reads alike: a NaN (only from overflow, edge case exp_spacing with cosine) matches a NaN there, and cargo test compares those bits"

[clustering.K6]
criterion = "exact"
compare = ["SCT_nn", "SCT_snn"]
detail = "dimensions, every stored entry in stored order, values bitwise"

# K1, K2, K8 and the chain's thread criterion (M11; docs/validation/clustering.md): `scrust cluster
# --counts --preset workflow` from each object's exported counts, with the stage dumps of M8's
# instrumented runs, against every R run of M8 in the same OpenBLAS profile (the portable runs on
# Sapphire Rapids and Cascade Lake with OPENBLAS_CORETYPE=Haswell, the production runs on Sapphire
# Rapids with the kernel detected; validation/slurm/m11_cluster.sbatch, label m11-eedf376, binary
# data/clustering/bin/scrust-m11-eedf376; jobs 60803803, 60803842, 60803843, 60803844), graded by
# kernel (exact: the kernels match). Settled (M11): exact, in all 222 comparisons of the 27 tier-T
# and 7 tier-P objects (portable 118, production 104), 20,383 checks and 1.11 billion values; the
# only checks not identical are the portable runs' silhouette widths against the saved objects
# (118), which are graded under the saved objects' kernel and stay within the floor, as M8 found.
#
# K1 SCTransform at seed 12345 (v5 and v3 assays: the emptyDrops objects' instrumented runs are v3,
# and their v5 runs were compared too): every S2a-S2d array R dumped (scale.data and the residual
# matrix wherever R kept them; R's digest of scale.data in its layout for the three light-level
# objects), the RNG checkpoints of SCTransform, every SCTransform scalar both runs recorded, and R's
# digest of .Random.seed after SCTransform.
[clustering.K1]
criterion = "exact"
blas_dependent = true
compare = ["S2a", "S2b", "S2c", "S2d", "scale_data (array, or its digest at level light)", "rng_vst_entry", "rng_after_cell_sampling", "rng_fits_entry", "rng_bin_entry", "rng_fits_exit", "rng_vst_exit", "rng_sctransform_exit", "rng_after_SCTransform_sha256", "stage_scalars"]
otherwise = { criterion = "floor", floor = "clustering.floor.kernel" }

# K2 RunPCA with 50 PCs at seed 12345 (work 66, capped for small objects): S3's embeddings,
# loadings, standard deviations and irlba's d, the PCA features, irlba's iterations and products,
# the total variance, the RNG checkpoints at RunPCA's and irlba's entry and exit, R's digest of
# .Random.seed after RunPCA, and the files: pca/ (embeddings, loadings and their features in order,
# standard deviations) against R's pca/.
[clustering.K2]
criterion = "exact"
blas_dependent = true
compare = ["S3_embeddings", "S3_loadings", "S3_sdev", "S3_irlba_d", "S2d_pca_features", "irlba_iter", "irlba_mprod", "total_variance", "rng_pca_entry", "rng_irlba_entry", "rng_irlba_exit", "rng_pca_exit", "rng_after_RunPCA_sha256", "pca/"]
otherwise = { criterion = "floor", floor = "clustering.floor.kernel" }
rng_state = "exact"

# K8 end to end, from the counts: K3-K7 from the Rust run's own PCA (K3_items, annoy.ann, K5's ids
# and distances, both graphs, K7's ids, labels, levels, printed numbers, singletons and
# .Random.seed after GroupSingletons, the workflow's files and logged numbers), the silhouette
# widths and closest clusters (K8_*, metadata.tsv), against the instrumented runs; the files
# against the direct runs (the runs without RunUMAP included): metadata.tsv's columns, the levels,
# cluster_ids.txt, nclusters.txt, pca/, the graphs, the result section's numbers; the labels and
# levels against the saved objects, and the silhouette widths against them in the production
# profile (graded under the saved objects' kernel, SapphireRapids). Not compared: the columns of
# later milestones (neighborhood_purity: M12; nCount_SCT, nFeature_SCT: M13), R's K9 and K10
# arrays, R's .Random.seed after RunUMAP (not ported; nothing later reads it). Silhouette is also
# teacher-forced on R's own embeddings and labels (the K8_* arrays), BLAS-free, exact on any machine:
# 98 comparisons with instrumented references, 490 checks identical.
[clustering.K8]
criterion = "exact"
blas_dependent = true
compare = ["K3", "K4", "K5", "K6", "K7", "K8_silhouette_width", "K8_silhouette_other", "K8_centroids", "K8_cluster_var", "metadata.tsv", "levels", "cluster_ids.txt", "nclusters.txt", "pca/", "graphs", "result", "saved labels and levels", "saved silhouette widths (production profile)"]
otherwise = { criterion = "floor", floor = "clustering.floor.kernel" }
teacher_forced_silhouette = "exact on any machine"
not_compared = [".Random.seed after RunUMAP"]
# (M11 also left out neighborhood_purity and the K9 arrays, which M12 compares under
# [clustering.K9], and nCount_SCT, nFeature_SCT and the K10 arrays, which M13 compares under
# [clustering.K10].)

# K9, neighbourhood purity (M12; docs/PLAN.md C3e, C5): bluster 1.20.0's neighborPurity as the
# workflow calls it (k = 50, weighted, BiocNeighbors 2.4.0's default index, KMKNN), searched
# exhaustively with knncolle's arithmetic (crates/knn/src/purity.rs) and summed as bluster sums
# (crates/cluster/src/purity.rs). Compared: each cell's 50th distance, the radius (R's median) and
# the mean neighbour count, the neighbour counts, the neighbour lists cell by cell where R kept
# them (level full, and the small tier-P object), the weights, the per-cluster sums, the totals,
# the purities and the maxima (K9_* against the instrumented runs); neighborhood_purity and
# purity_maximum in metadata.tsv against the direct runs; neighborhood_purity against the saved
# object, under its kernel. Teacher-forced on R's own embeddings and labels the comparison is
# BLAS-free, so exact on any machine; from the counts it depends on the PCA, so it is
# BLAS-dependent: exact under the reference's kernel, otherwise within [clustering.floor.kernel].
#
# The certificate: every pair close enough to a threshold for KMKNN's floating-point
# triangle-inequality bounds to treat it differently from the exhaustive search. Step 3 (the range
# query): pairs within the radius with a raw (squared) distance above
# L = ((radius - kappa B)/(1 + e))^2 (1 - g). Step 1 (the 50th distance): a raw distance in (v, H),
# H = ((sqrt(v/(1 - g))(1 + e) + kappa B)/(1 - u))^2, above a cell's 50th raw distance v. From
# knncolle's arithmetic as BiocNeighbors 2.4.0 builds it (u = 2^-53, dims summed m):
# g = gamma(m + 2), e = g/2 + g^2/2 + u + ug, kappa = 2e + u + eu, B the diagonal of the cells'
# bounding box, each side widened by the k-means centres' rounding (gamma(n + 2) + 2u) max|x|;
# each constant enlarged by 1%, each threshold moved 16 ulps outwards. Each flag is labelled
# median_pair (a cell whose 50th distance is the radius, and its 50th neighbour: on the radius by
# construction, so with an odd number of cells whenever it is within it) or other.
#
# M12's decision point (C6): the certificate flags pairs, so the user chose between porting KMKNN
# and agreeing how to treat the flagged cells. Decided on 2026-11-17: keep the exhaustive result,
# report the flagged pairs (summary.json result.purity.certificate, the stage dumps'
# K9_certificate_*, the validation reports and docs/validation/clustering.md), and grade the
# certificate "flagged, reported", passing. M17's comparison of the 840 saved objects' purities
# covers every flagged pair. A KMKNN port can follow (plan C6), and nothing depends on it.
# Decision-point survey (validation/slurm/m12_certificate.sbatch, binary scrust-m12-survey, jobs
# 61647015 and 61647016): on R's own embeddings, both profiles' instrumented runs of the 34 objects
# (68 runs), the certificate flags the median pair of each of the 17 odd-sized objects whenever it
# is within the radius (23 runs, at 0 or 1 ulp below the radius squared) and nothing else; every
# other K9 check is identical to R's (1,053 teacher-forced, 181 others).
[clustering.K9]
criterion = "exact"
blas_dependent = "from the counts or from SCTransform's output; BLAS-free from R's embeddings (teacher-forced)"
compare = ["K9_dist50", "purity_radius", "purity_mean_neighbors", "K9_neighbor_count", "K9_neighbors (cell by cell)", "K9_weights", "K9_sums", "K9_totals", "K9_purity", "K9_maximum", "metadata.tsv neighborhood_purity", "metadata.tsv purity_maximum", "saved neighborhood_purity"]
otherwise = { criterion = "floor", floor = "clustering.floor.kernel" }
teacher_forced = "exact on any machine"
saved_objects = "exact in the production profile; the portable runs graded under the saved objects' kernel against the floor (K9_purity), as M8 measured"
certificate = "flagged pairs reported, not failed (M12's decision); every flag labelled median_pair or other"
certificate_decision = "2026-11-17: keep the exhaustive result; report the flagged pairs; M17's saved purities check them; a KMKNN port is optional"
