# Match criteria for each tool, stage and output (docs/PLAN.md A4 and B5). Three kinds:
#   exact      bitwise or integer equality
#   numeric    relative and/or absolute tolerance
#   agreement  fraction identical, correlation
# Exact checks run only when the BLAS-relevant fields of the environment fingerprint match the
# reference's; otherwise the harness switches to tolerance mode (the R-vs-R floor, measured at
# M2) and says so in its report (A5b). From M11 both validators do this (kernel-gated grading,
# [doubletfinder.kernel_gating] and [clustering.kernel_gating] below; scio::grade).
#
# The criteria are the plan's (B5) and the key names a proposal. Each stage is uncommented and
# settled when its milestone lands (S0: M1; S1 and S4-S7: M3; S2a-S2d: M4; S3: M5; the end-to-end,
# saved-output and performance rows: M6; the singlets row: M6b; the full panel: M7). The
# clustering crate's criteria (plan C5) follow DoubletFinder's, from M8 on.
# `scrust validate doubletfinder` (crates/doubletfinder/src/validate.rs) applies the settled
# criteria: everything it compares must be identical.

# DoubletFinder -------------------------------------------------------------------------------

# S0 RNG and R semantics: vectors and checkpoints against R (M1). Settled: every double bitwise,
# NaN payloads included (crates/rcompat/tests/r_vectors.rs, tests/fixtures/rcompat/).
[doubletfinder.S0]
criterion = "exact"

# R-vs-R floor (M2; docs/validation/doubletfinder_m2.md): how far R itself moves when only the
# machine changes. Measured with instrumented runs (every stage array and .Random.seed
# checkpoint, block by block) on the five tier-T objects and on soupx_tenx_SRR18256555,
# soupx_tenx_10xmousebrain and soupx_emptydrops_4500871lane; the two large objects end to end
# (M2), and per stage from M11, which made their production-profile instrumented runs.
# Settled as measurements; the stage criteria below are settled at their milestones.
#
# Same kernel, different CPU types: OPENBLAS_CORETYPE=Haswell (the portable profile) on Sapphire
# Rapids (Xeon Platinum 8480CL) and Cascade Lake (Xeon Platinum 8268), tier T and
# soupx_tenx_SRR18256555: every stage array, RNG checkpoint and final file bit-identical.
[doubletfinder.floor.cpu_type]
all_stages = "identical"

# Different kernels, same CPU type: Haswell against SapphireRapids (the production profile, by
# detection) on Sapphire Rapids, on all ten objects. Maxima over objects and contexts, rounded up
# to two significant digits; max_scaled is max|a - b| / max|a| within one block; S3 embeddings and
# loadings after aligning each component's sign (irlba's signs can flip between kernels); counts
# (values_differing, cells_differing) are totals over the ten objects. Everything not listed is
# identical: S1, S2a, S2b, S2c, all RNG checkpoints (so irlba's draw count), every scalar, S5, S6,
# S7 and the final cells.tsv, sweep_stats.tsv and bcmvn.tsv.
#
# M11 measured it again with `scrust validate floor` (validation/slurm/m11_floor.sbatch): first on
# M2's eight objects (data/doubletfinder/compare/floor_kernel_m11/, job 60798602), reproducing M2's
# table, then on all ten (floor_kernel_m11_ten_objects/, job 61102448), with the two large objects'
# instrumented production runs, which M11 made (jobs 61097286 and 61097287). The large objects
# raise three bounds: S3's embeddings (max_abs 3.548e-11 -> 3.665e-11, scaled 2.407e-13 ->
# 3.133e-13, was 3.6e-11 and 2.5e-13) and loadings (8.034e-14 -> 8.370e-14, was 8.1e-14), both at
# soupx_emptydrops_sscovelli's sweep_pN0.1; and S4's digest (below). Everything else of theirs
# stays within the eight objects' bounds.
[doubletfinder.floor.kernel]
S2d_residual_stats = { max_abs = 5.7e-14, max_scaled = 1.4e-16 }
S2d_scale_data = { max_abs = 2.2e-14, max_scaled = 1.2e-15, max_fraction_differing = 0.008 }
S3_sdev = { max_rel = 7.3e-15 }
S3_embeddings = { max_abs = 3.7e-11, max_scaled = 3.2e-13 }
S3_loadings = { max_abs = 8.4e-14, max_scaled = 3.0e-13 }
# irlba's d (M11), from M2's own measurement (docs/validation/doubletfinder_m2.md, R-vs-R floor);
# the ten objects give the same maxima (7.503e-12, 3.799e-15).
S3_irlba_d = { max_abs = 7.6e-12, max_scaled = 3.8e-15 }
# S4's digest of each real cell's first ind (sweep) or k + 1 (final) order() positions (M11, the
# ten objects). A digest has no magnitude to bound, so the entry bounds how many cells' digests
# differ. Identical in every block of nine objects; in cellbender_fromraw_ghirsutum2's final run
# (k = 2,373) R orders 3 of the 59,323 cells' neighbours differently under the two kernels: the
# same k + 1 neighbours, with two or three of them, at distances equal to within 1.1e-15 (exact
# ties under one kernel), in another order. pANN (S5) and the calls (S7) stay identical.
S4_digest = { cells_differing = 3, values_differing = 6, objects = 1 }

# Kernel-gated grading (M11; docs/PLAN.md A5b mechanism 3): `scrust validate doubletfinder` grades
# every check exactly when the reference's and the candidate's recorded OpenBLAS kernels
# (run.fingerprint.openblas_corename) are the same; otherwise, or when either run records none, in
# tolerance mode: each BLAS-free check stays exact, each BLAS-dependent stage array and scalar is
# graded against [doubletfinder.floor.kernel] (bounds: the keys starting with max_, and the counts
# values_differing and cells_differing), and what the floor does not list stays exact, since the
# floor found it identical across kernels. The report gives the mode, why, and each check's class
# and criterion. A check is BLAS-dependent when any of its inputs passed through a BLAS product in
# the candidate's run (crates/doubletfinder/src/validate.rs, Grading::class):
#   - teacher-forced runs (on R's own embeddings, --from-stages): every check is BLAS-free;
#   - runs from the counts: BLAS-free are S1 and S2a, and the RNG states of the sampling and of
#     SCTransform's fits (whose draw counts are fixed), in the contexts whose doublets are drawn
#     from a fresh set.seed(12345) (the first sweep iteration, sweep_pN0.05, and the final run), and
#     the checks made from R's own states or arrays (S1 redrawn from R's checkpoints, S6 and S7
#     recomputed from R's S5); BLAS-dependent is everything else: S2b (glmGamPoi's Cox-Reid term
#     calls dgemv, nlminb calls ddot and dnrm2), S2c, S2d, S3 and every later stage, irlba's draw
#     counts, the other sweep iterations (their doublets are drawn after the previous irlba), the
#     final files and the result section.
# With the same kernel every verdict is the one Step 1's validator gave before M11 (the kernel
# check itself is identical, and nothing else changes): validation/slurm/m11_doubletfinder.sbatch
# re-graded M6's and M7's Rust runs (docs/validation/clustering.md, "Kernel-gated grading").
[doubletfinder.kernel_gating]
exact_when = "the reference's and the candidate's recorded OpenBLAS kernels match"
otherwise = "tolerance: BLAS-free checks exact; BLAS-dependent checks within [doubletfinder.floor.kernel], exact where it lists nothing"
no_kernel_recorded = "tolerance (never exact)"
blas_free = ["S1 and S2a in sweep_pN0.05 and final", "RNG states of the sampling and of SCTransform's fits in those contexts", "S1 redrawn from R's checkpoints", "S6 and S7 recomputed from R's S5", "every check of a teacher-forced run"]
blas_dependent = ["S2b", "S2c", "S2d", "S3", "S4", "S5", "S6", "S7", "S1 and S2a of the other sweep iterations", "irlba's RNG states", "cells.tsv, sweep_stats.tsv, bcmvn.tsv", "the result section", "the saved output's checks"]
floor = "doubletfinder.floor.kernel"

# S1 sampling: subsample and doublet index pairs, RNG state after each step. Settled (M3):
# exact. From R's own .Random.seed before each draw, rcompat redraws the sweep subsample
# (sample(1:n, 10000), when n > 10,000) and both sample(real.cells, n_doublets, replace = TRUE)
# draws of every sweep iteration and of the final run: identical to R's S1_subsample and
# S1_doublets, and R's .Random.seed afterwards identical, in all 24 instrumented runs of the 10
# objects (docs/validation/doubletfinder_m3.md). The Rust runs of M3 take the draws from R
# (teacher forcing); M6 makes them.
[doubletfinder.S1]
criterion = "exact"
compare = ["S1_subsample", "S1_doublets", "rng_state_after"]

# S2a SCTransform setup: log_umi, filtered genes, gmeans, fitting cells and genes, bins,
# RNG state (M4a). Settled (M4): exact. In every context of all 24 instrumented runs of the 10
# objects, from the SCT input rebuilt from the counts and R's S1 draws: cell attributes, the gene
# filter, geometric means, means and variances (explicit zeros as R stores them), the fitting
# cells and genes, the density-weighted gene sampling (density, probabilities, the draw), and R's
# .Random.seed at vst's entry, after the cell sampling and at the fits' entry
# (docs/validation/doubletfinder_m4.md).
[doubletfinder.S2a]
criterion = "exact"
compare = ["S2a_cells", "S2a_genes", "S2a_gene_stats", "S2a_cells_step1", "S2a_genes_step1_pool",
           "S2a_genes_step1", "S2a_log_gmean_step1", "S2a_sampling_prob", "S2a_density",
           "rng_vst_entry", "rng_after_cell_sampling", "rng_fits_entry"]

# S2b SCTransform fits: per-gene Beta and theta, given R's fitting cells and genes (M4b).
# Settled (M4): exact, so the decision point's fallback (relative 1e-6) is not needed. Every
# intermediate of every gene's glmGamPoi fit (moment dispersion and start, first Newton fit and
# its iterations, the overdispersion MLE through nlminb with the Cox-Reid term, the trend, the
# second fit, its iterations and deviance), model_pars before and after the 1e-7 floor, and the
# RNG state at each bin's future_lapply and at the fits' exit, in all 24 runs; the Cox-Reid
# sums are OpenBLAS dgemv calls, identical across kernels at these sizes.
[doubletfinder.S2b]
criterion = "exact"
compare = ["S2b_glm", "S2b_model_pars_raw", "S2b_model_pars", "rng_bin_entry", "rng_fits_exit"]

# S2c SCTransform regularisation: regularised parameters, given R's fit outputs (M4c). Settled
# (M4): exact. model_pars_fit of every kept gene, the outliers, the Poisson and smoothing genes,
# mean(colSums(umi)) and the bw.SJ bandwidth, in all 24 runs.
[doubletfinder.S2c]
criterion = "exact"
compare = ["S2c_model_pars_fit", "S2c_outliers", "S2c_poisson_genes", "S2c_smoothing_genes",
           "mean_cell_sum", "reg_bw"]

# S2d SCTransform residuals: residual variance, the 3,000 variable features (ordered) and
# scale.data, given R's parameters (M4d). Settled (M4): exact when the OpenBLAS kernel is the
# reference run's (the residuals' tcrossprod is a dgemm call): residual mean and variance of every
# kept gene, the top, variable and PCA features in order, min_variance and both clip ranges, and
# wherever R dumped them the full residual matrix and scale.data, in all 24 runs, each under its
# own profile (portable runs with OPENBLAS_CORETYPE=Haswell, production runs with SapphireRapids
# detected). Under another kernel the comparison is not exact; the fallback stays as proposed.
# Floor (M2): across OpenBLAS kernels, residual statistics and scale.data differ in the last
# bits on the larger objects (at most 5.7e-14 absolute, in at most 0.8% of a scale.data block);
# bit-identical on tier T, and across CPU types with the same kernel. Fallback, about 20 times
# the floor: numeric, abs = 1e-12.
[doubletfinder.S2d]
criterion = "exact"
blas_dependent = true
compare = ["S2d_residual_stats", "S2d_top_features", "S2d_variable_features", "S2d_pca_features",
           "S2d_scale_data", "S2d_y", "min_variance", "res_clip_range", "clip_range"]
otherwise = { criterion = "numeric", abs = 1e-12 }

# S2 chained (M4): the whole SCTransform from the counts and R's S1 draws, each sub-stage on the
# previous one's Rust results; every S2 array, scalar and RNG checkpoint above plus the states at
# vst's and SCTransform's exits. Settled: exact, in all 24 runs (under each run's kernel).
[doubletfinder.S2_chain]
criterion = "exact"
blas_dependent = true

# S3 PCA: standard deviations, embeddings (up to sign per component), RNG state afterwards (M5).
# Identical when the BLAS kernel matches the fixture; otherwise relative <= 1e-10. The RNG state
# must always match exactly.
# Floor (M2): across kernels, sdev relative 7.3e-15, embeddings max|diff|/max|value| 2.5e-13
# (components can flip sign); RNG states identical. The plan's 1e-10 leaves a margin of ~400.
# Settled (M5): exact, signs included, under the run's own OpenBLAS kernel (Haswell for the
# portable runs, SapphireRapids for the production runs, detected). In all 7 contexts of all 24
# instrumented runs of the 10 objects, teacher-forced on R's PCA input (for the light runs, on
# Rust's S2d, itself identical to R's) and chained after Rust's own SCTransform: irlba's d, the
# standard deviations, the embeddings, the loadings, the PCA features (PrepDR's filter),
# irlba's iterations and products, total.variance, and R's .Random.seed at RunPCA's entry, at
# irlba's entry and exit and at RunPCA's exit (docs/validation/doubletfinder_m5.md). The results
# do not depend on the number of threads. Under another kernel the comparison is not exact; the
# fallback stays as proposed.
[doubletfinder.S3]
criterion = "exact"
blas_dependent = true
compare = ["S3_irlba_d", "S3_sdev", "S3_embeddings", "S3_loadings", "S2d_pca_features",
           "irlba_iter", "irlba_mprod", "total_variance", "pca_n_features",
           "rng_pca_entry", "rng_irlba_entry", "rng_irlba_exit", "rng_pca_exit"]
otherwise = { criterion = "numeric", rel = 1e-10 }
rng_state = "exact"

# S3 chained (M5): RunPCA on Rust's own SCTransform of the counts and R's S1 draws, with the
# generator SCTransform left; every S3 array, scalar and RNG checkpoint above. Settled: exact, in
# all 24 runs (under each run's kernel).
[doubletfinder.S3_chain]
criterion = "exact"
blas_dependent = true

# S4 neighbours: the first `ind` (sweep) or k + 1 (final) order positions of every real cell.
# Plan floor: identical for >= 99.99% of cells, each difference explained by a near-tie.
# Floor (M2): identical across kernels and CPU types on every object (the S3 differences above
# move no neighbour), so S5-S7 are identical too. M11, measuring the two large objects per stage:
# across kernels R orders 3 of cellbender_fromraw_ghirsutum2's 59,323 cells' neighbours differently
# in the final run, near-ties within the same k + 1 neighbours ([doubletfinder.floor.kernel]
# S4_digest); S5-S7 stay identical.
# Settled (M3): exact. On R's own S3 embeddings, every cell's S4 digest is identical in all 24
# instrumented runs of the 10 objects, and on tier T the full order positions (15 runs,
# 3.1 million positions), including the lower-index twins of cellbender_fromraw_ghirsutum2 that
# come before the cell itself. No near-tie needed explaining.
[doubletfinder.S4]
criterion = "exact"
compare = ["S4_digest", "S4_positions"]

# S5 pANN, sweep and final, per cell. Plan floor: identical for >= 99.9% of cells; otherwise
# |difference| <= 2/k.
# Settled (M3): exact, bit for bit, for every pK of every sweep iteration and the final run, in
# all 24 instrumented runs (and cells.tsv byte-identical to every direct R run's).
[doubletfinder.S5]
criterion = "exact"
compare = ["S5_pann_sweep", "S5_pann_final"]

# S6 sweep: BCreal and the chosen pK. Plan floor: BCreal relative <= 1e-6; pK identical.
# Settled (M3): exact. bkde's grid and density, the values passed to bimodality_coefficient and
# BCreal are bit-identical for every (pN, pK) (teacher-forced on R's S5 and chained from Rust's
# S5); sweep_stats.tsv and bcmvn.tsv byte-identical; pK, its label and the column names
# identical, in all 24 instrumented runs.
[doubletfinder.S6]
criterion = "exact"
compare = ["S6_bkde", "S6_gkde", "BCreal", "bcmvn", "pK", "pK_label"]

# S7 calls: nExp and the Doublet/Singlet set. Plan floor: nExp identical; >= 99.9% agreement,
# every difference at the pANN cutoff.
# Settled (M3): exact. nExp_poi, the homotypic proportion and nExp identical; the calls
# identical (also teacher-forced on R's final pANN), in all 24 instrumented runs, including the
# ties at the cutoff (stable descending order).
[doubletfinder.S7]
criterion = "exact"
compare = ["nExp_poi", "homotypic_prop", "nExp", "S7_doublet"]

# End to end (M6): `scrust doubletfinder` from the counts, the cluster labels and the seed, every
# stage computed by Rust, the random-number state flowing through the seven contexts of a run
# from Rust's own draws (nothing read from an R run). Settled: exact, under the reference run's
# OpenBLAS kernel (the portable runs with OPENBLAS_CORETYPE=Haswell, the production runs with
# SapphireRapids detected; the kernel each run recorded is compared too). In all 24 instrumented
# runs of the 10 objects: every block of every stage array R dumped, S1 to S7 (scale.data and the
# residual matrix wherever R dumped them), every .Random.seed checkpoint and their sequence, every
# per-context scalar, the final files and every field of summary.json's result section, the
# digest of R's final .Random.seed included. In all 23 direct runs: cells.tsv, sweep_stats.tsv
# and bcmvn.tsv byte-identical, the result section identical. Not compared: summary.json's run
# section, a record of the run (R's and Rust's differ by nature: script or program, input and
# output paths, start time, SLURM job, profile label, versions and library paths, timings and
# memory per phase; R's load_input_s and peak_rss_after_load_kib, Rust's parameters, threads
# and dump level), apart from the OpenBLAS kernel in its fingerprint; and R's five structural
# checks of its own Seurat containers among the stage scalars (vst_rows_are_input_features,
# scale_data_rows_are_top_features, variable_features_equal_top_features,
# scale_data_equals_sctransform_default_y, pca_cells_are_vst_cells), which hold by
# construction in Rust (docs/validation/doubletfinder.md). The results do not depend on the
# number of threads (1, 8 and 32 on the P objects; 1 to 7 on tier T). Validation label m6-bc1b48e
# (job 60007108): 24 instrumented runs, 13,396 checks and 2,646 RNG checkpoints identical, 1.58
# billion values compared; 23 direct runs and 20 saved-output comparisons identical.
[doubletfinder.end_to_end]
criterion = "exact"
blas_dependent = true
compare = ["cells.tsv", "sweep_stats.tsv", "bcmvn.tsv", "result", "S1", "S2a", "S2b", "S2c", "S2d", "S3",
           "S4", "S5", "S6", "S7", "rng_checkpoints", "rng_checkpoint_sequence", "stage_scalars",
           "openblas_kernel"]
not_compared = ["summary.json run section (except the OpenBLAS kernel)", "R's structural checks of its own containers"]

# Against the saved workflow outputs (tiers T and P; the full panel in M7): the doublet set
# (input barcodes minus the kept barcodes), the kept cells' pANN as R wrote them, pK and nExp
# (from the column names). Settled (M6): exact. Rust's run of each of the 10 objects reproduces
# its saved output in both profiles: the same doublet set, every kept cell's pANN identical as
# 17-digit text (so bitwise), in order, the same pK label, nExp and column names. M7: the same on
# all 150 production objects ([doubletfinder.full_panel]).
[doubletfinder.saved_outputs]
criterion = "exact"
compare = ["doublet_set", "singlet_pANN", "pK_label", "nExp", "pANN_column", "classification_column"]

# The singlets' counts (M6b; docs/PLAN.md A3, B3 and B5): `singlets/`, the counts without the
# doublets as a new 10x directory, written in addition to the outputs above. It is compared with
# the saved workflow output's RNA counts layer (validation/R/export_doubletfinder_singlets.R).
# Settled (M6b): exact. All 20 Rust runs (10 objects, both profiles; label m6b-13592a6) write the
# saved object's counts. Identical: the barcodes in order, the feature lines, the header field,
# and every stored entry (explicit zeros included) and value, bit for bit; 409,874,942 entries.
# On all 10 objects the saved counts equal the input's restricted to the kept cells, slot for slot.
# M7: the same on all 150 production objects, 3,285,047,618 entries ([doubletfinder.full_panel]).
[doubletfinder.singlets]
criterion = "exact"
compare = ["barcodes", "feature_lines", "header_field", "stored_entries", "values"]

# The full panel (M7; docs/PLAN.md B4 to B6, docs/validation/doubletfinder_m7.md): all 150 production
# DoubletFinder objects of the workflow (validation/doubletfinder_panel.tsv: 30 samples x 5 arms,
# 1,120 to 79,409 cells), each against the output the workflow saved: the saved_outputs checks and
# the singlets row above, nine checks per object. Each Rust run in the production profile, on the
# CPU type of the object's workflow job (Sapphire Rapids for all 150, from sacct and the nodes'
# SLURM features) with OpenBLAS detecting the kernel (SapphireRapids in all 150). An object
# passes when all nine checks are made and identical. Settled (M7): exact, 150 of 150. Label
# m7-b8c8a8c (array job 60163542, binary scrust-m7-b8c8a8c, 8 threads): 1,350 of 1,350 checks
# identical; 353,762 doublets, 2,217,328 kept cells' pANN and 3,285,047,618 stored entries of the
# singlets' counts compared, none differing. Main's binary (label m7-d95f7f7, job 60160715) gave
# identical outputs, file for file. Peak RSS at most 6.64 GiB (soupx_emptydrops_amellifera).
[doubletfinder.full_panel]
criterion = "exact"
objects = 150
profile = "production"
compare = ["pANN_column", "classification_column", "pK_label", "nExp", "doublet_set", "singlet_pANN",
           "singlets_barcodes", "singlets_feature_lines", "singlets_matrix"]
passed = 150

# Performance: peak RSS and wall time below the direct R DoubletFinder run on the same input;
# soupx_emptydrops_sscovelli <= 10 GiB. Settled (M6): met. `scrust doubletfinder` on the exported
# input, production profile, Intel Xeon Platinum 8480CL, against the direct production R run of
# M2 on the same input and CPU type (one CPU), every output identical to R's
# (docs/validation/doubletfinder.md; jobs 60007089 and 60007102, binary scrust-m6-bc1b48e):
#   soupx_emptydrops_sscovelli     R 36:15, 126.95 GiB; Rust 6:21, 4.41 GiB (1 thread), 43.5 s, 4.51 GiB (32)
#   cellbender_fromraw_ghirsutum2  R 33:53, 150.41 GiB; Rust 8:58, 4.02 GiB (1 thread), 60.9 s, 4.08 GiB (32)
[doubletfinder.performance]
criterion = "peak RSS and wall time below the direct R run on the same input and CPU type"
sscovelli_peak_rss_gib_max = 10
measured = [
  { object = "soupx_emptydrops_sscovelli", side = "R", threads = 1, wall_s = 2175.3, peak_rss_gib = 126.95 },
  { object = "soupx_emptydrops_sscovelli", side = "Rust", threads = 1, wall_s = 380.6, peak_rss_gib = 4.41 },
  { object = "soupx_emptydrops_sscovelli", side = "Rust", threads = 32, wall_s = 43.5, peak_rss_gib = 4.51 },
  { object = "cellbender_fromraw_ghirsutum2", side = "R", threads = 1, wall_s = 2033.0, peak_rss_gib = 150.41 },
  { object = "cellbender_fromraw_ghirsutum2", side = "Rust", threads = 1, wall_s = 538.4, peak_rss_gib = 4.02 },
  { object = "cellbender_fromraw_ghirsutum2", side = "Rust", threads = 32, wall_s = 60.9, peak_rss_gib = 4.08 },
]
# M6b: the same benchmark with singlets/ written too. The counts are read again after the calls,
# then written as a new 10x directory. Peak RSS is unchanged (jobs 60114424 and 60114425, binary
# scrust-m6b-13592a6; singlets_s is the time that phase took):
measured_m6b = [
  { object = "soupx_emptydrops_sscovelli", side = "Rust", threads = 1, wall_s = 432.1, peak_rss_gib = 4.41, singlets_s = 34.2 },
  { object = "soupx_emptydrops_sscovelli", side = "Rust", threads = 32, wall_s = 54.0, peak_rss_gib = 4.49, singlets_s = 9.9 },
  { object = "cellbender_fromraw_ghirsutum2", side = "Rust", threads = 1, wall_s = 573.4, peak_rss_gib = 4.02, singlets_s = 37.9 },
  { object = "cellbender_fromraw_ghirsutum2", side = "Rust", threads = 32, wall_s = 69.0, peak_rss_gib = 4.08, singlets_s = 11.0 },
]

# Clustering (Step 2, plan C5) ----------------------------------------------------------------
#
# The criteria are the plan's (C5): K0-K13, the saved outputs, the parameter grid, threads and
# performance, each settled at its milestone (K0 and K3-K6: M9; K7: M10; K1, K2 and K8: M11;
# K9: M12; K10: M13; K11 and K13: M14; K12: M15; the grid: M16; the full panel: M17). M8 settles
# only what its own checks need: the reference runs against the saved objects, the marker
# references and the instrumented optimizer, all exact, and the R-vs-R floor, as measurements
# (docs/validation/clustering_m8.md).

# Saved objects (M8): a direct run of the workflow's chain on the object's exported counts, in
# the production profile (OpenBLAS detecting SapphireRapids on Sapphire Rapids, the CPU type of
# every workflow job), reproduces its saved object exactly. Settled (M8): exact in every file,
# for every production-profile run of the 27 tier-T and 7 tier-P objects (direct, instrumented,
# without RunUMAP, and through the v5 assay path for the emptyDrops objects): 104 runs.
# Portable-profile runs (Haswell kernel) are not held to this: their differences from the saved
# objects belong to the floor (below; output by output in docs/validation/clustering_m8_floor.tsv),
# as A5b, K8 and C3i say, and as C6's M8 row states.
[clustering.saved_objects]
criterion = "exact"
profile = "production"
compare = ["SCT_snn_res.0.8", "seurat_clusters", "levels", "silhouette_width", "neighborhood_purity",
           "nCount_SCT", "nFeature_SCT", "sct_counts", "sct_data", "sct_scale_data", "sct_model",
           "variable_features", "pca", "SCT_nn", "SCT_snn"]
runs = 104

# Marker references (M8): the workflow's find_markers.R and combine_markers.R steps on each saved
# object reproduce its saved <prefix>_markergenes.csv byte for byte, the clusters combined in the
# saved table's order (Snakemake's directory order, not level order). Settled (M8): exact, 34 of
# 34 tier-T and tier-P objects, so every reference is the saved table.
[clustering.marker_references]
criterion = "exact"
objects = 34
reference = "the saved table"

# Instrumented optimizer (M8): Seurat's ModularityOptimizer.cpp standalone, patched only to print,
# on R's own SNN graph: its final partition equals R's optimizer result (before GroupSingletons),
# and its printed nodes, edges, maximum modularity (%.4f) and communities equal R's and the
# workflow logs'. Settled (M8): exact, 34 of 34.
[clustering.instrumented_optimizer]
criterion = "exact"
objects = 34

# R-vs-R floor (M8): how far R itself moves when only the machine changes. Measurements; the
# stage criteria are settled at their milestones.
#
# Same kernel, different CPU types: OPENBLAS_CORETYPE=Haswell (the portable profile) on Sapphire
# Rapids (Xeon Platinum 8480CL) and Cascade Lake (Xeon Platinum 8268), all 27 tier-T objects and
# soupx_tenx_SRR18256555, direct and instrumented runs: every file, stage array, RNG checkpoint and
# the Annoy index identical.
[clustering.floor.cpu_type]
all_stages = "identical"

# Different kernels, same CPU type: Haswell against SapphireRapids (detected) on Sapphire Rapids,
# instrumented runs of all 27 tier-T and 7 tier-P objects. Identical in every object:
# SCTransform's S2a-S2c and variable features, every RNG checkpoint (so irlba's draw count), the
# corrected counts and their log1p (K10), the neighbour ids (K5), both graphs (K6), the
# optimizer's result, the labels and levels (K7). The rest, as maxima over the objects (T: 27
# objects, 5,904 cells; P: 7 objects, 271,509 cells); embeddings after aligning each component's
# sign; max_scaled is max|a - b| / max|a| within one array; S2d identical on tier T. scale.data
# on tier P: the four objects whose runs dumped it, and the three light-level objects measured by
# validation/R/floor_scale_data.R against their saved objects, which the production runs reproduce:
#
# M11 measured the floor again with the statistics kernel-gated grading uses (scio::grade,
# `scrust validate floor`; validation/slurm/m11_floor.sbatch, job 60798602, the 34 objects'
# instrumented runs in both profiles; data/clustering/floor_kernel_m11/: blocks.tsv, summary.md):
# every entry M8 listed is reproduced, and the arrays and scalars M8 did not tabulate are added
# (S3_irlba_d, S3_loadings, irlba_iter, irlba_mprod, K4_annoy_index, K8_centroids,
# K8_cluster_var). Values are the maxima over the 34 objects, rounded up (two entries M8 rounded
# down by less than their last digit are corrected: S2d_residual_stats max_scaled 3.2e-17 ->
# 3.21e-17, measured 3.204e-17; K5_nn_dist max_abs 1.9e-6 -> 1.91e-6, measured 1.907e-6).
# Identical across kernels in every object, and so not listed: everything else, including the
# total variance and every scalar of SCTransform, Annoy and the optimizer.
# How tolerance mode reads an entry (scio::grade): keys starting with max_ are bounds, and so are
# values_differing and cells_differing (totals over the objects measured, so they bound one object
# too); may_differ = true means the floor found the bytes differing in every object, without a
# numeric measure; other keys (note, fraction_differing, objects, ...) are measurements only.
[clustering.floor.kernel]
S2d_residual_stats = { max_abs = 1.5e-14, max_scaled = 3.21e-17 }
S2d_scale_data = { max_abs = 4.3e-14, max_fraction_differing = 0.0072 }
S3_sdev = { max_abs = 1.9e-13, max_scaled = 3.6e-14 }
S3_irlba_d = { max_abs = 6.94e-12, max_scaled = 3.56e-14 }
S3_embeddings_dims_1_30 = { max_abs = 1.6e-10, max_scaled = 2.4e-12 }
S3_embeddings_dims_31_50 = { max_abs = 4.3e-6, note = "trailing components of the smallest tier-T objects" }
S3_loadings = { max_abs = 1.2e-7, max_scaled = 4.5e-7, note = "component 50 of the smallest tier-T objects; 1.6e-12 on tier P" }
irlba_iter = { max_abs = 2, objects_differing = 5, note = "five small post-hoc tier-T objects restart once or twice more or fewer; .Random.seed is identical (no extra draws)" }
irlba_mprod = { max_abs = 12, objects_differing = 5 }
K3_items = { values_differing = 121, cells_differing = 121, max_abs = 9.6e-7, float_ulps = "116 values 1, 3 values 2-4, 2 values near 0 more" }
K4_annoy_index = { may_differ = true, objects_differing = 34, note = "the stored split vectors carry the PCA's sign flips and last bits; the neighbour ids (K5) and both graphs (K6) are identical in all 34" }
K5_nn_dist = { cells_differing = 10, values_differing = 11, max_abs = 1.91e-6 }
K8_silhouette_width = { max_abs = 3.3e-13, fraction_differing = 0.99 }
K8_centroids = { max_abs = 6.68e-11, max_scaled = 4.67e-13, note = "after aligning each dimension's sign" }
K8_cluster_var = { max_abs = 1.75e-9, max_scaled = 1.67e-13 }
K9_dist50 = { max_abs = 6.5e-11, max_scaled = 2.8e-13 }
K9_neighbor_count = { cells_differing = 22, objects = 11 }
K9_purity = { cells_differing = 19, objects = 10, max_abs = 0.019 }
# M12 adds the K9 entries M11's measurement holds but M8's table did not list (job 60798602,
# data/clustering/floor_kernel_m11/summary.md; maxima over the 34 objects, rounded up), and the
# neighbour lists compared cell by cell, which that measurement could only call incomparable
# (lengths differ): measured on the 28 objects whose runs kept them (27 tier T and
# soupx_tenx_SRR18256555), 12 cells in 6 objects, each the median cell or its k-th neighbour of
# an odd-sized object, none differing in order only. In every case the median cell's k-th
# neighbour lies on the radius and the kernel decides whether it is within it (M12).
K9_sums = { cells_differing = 22, objects = 11, max_abs = 1.8e-2, max_scaled = 2.0e-2 }
K9_totals = { cells_differing = 22, objects = 11, max_abs = 1.8e-2, max_scaled = 1.04e-2 }
K9_neighbors = { cells_differing = 12, objects = 6, note = "the 28 objects with lists; each differing list gains or loses one cell" }
purity_radius = { max_abs = 1.2e-12, max_scaled = 6.3e-14 }
purity_mean_neighbors = { max_abs = 2.3e-2, max_scaled = 5.2e-4, objects = 11 }
